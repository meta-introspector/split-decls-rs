# goal.toml
original-goal = "process all crates declaratively specified in the [wrapping] section of split-decls-rs.toml, extract all their declarations, copy them to output/, and generate a new cargo.toml workspace root and cargo tomls for them"

# Ansible-like playbook definition for a declaration processing workflow
[workflow]
name = "Ecosystem Declaration Splitting and Workspace Generation"
description = "Processes Rust crates to extract declarations and re-organize them into a new workspace."
style_influences = ["Ansible", "Lisp", "Lean4", "Rust", "LLVM", "Bash"]

[[workflow.stages]]
name = "Read Wrapping Configuration"
description = "Reads the `split-decls-rs.toml` file to get the list of crates to wrap."
processor_hint = "TOML parsing and validation"
operation = { type = "function_call", function = "read_wrapping_config", args = ["split-decls-rs.toml"] }
outputs = [{ name = "crates_to_wrap", type = "list<string>", description = "List of crate names to be wrapped." }]

[[workflow.stages]]
name = "Extract and Copy Declarations"
description = "For each crate in the wrapping list, finds it, extracts all top-level declarations, and copies them to the designated output directory."
processor_hint = "LLVM-like pass over AST, Rust-like type extraction"
inputs = [{ name = "crates_to_process", from_stage = "Read Wrapping Configuration", output_name = "crates_to_wrap" }]
operation = { type = "loop", over = "crates_to_process", loop_var = "crate_name" }

  [[workflow.stages.operation.tasks]]
  name = "Find and Extract Declarations for Crate"
  operation = { type = "function_call", function = "find_and_extract_declarations", args = ["{{ crate_name }}"], output_base = "output/" }
  outputs = [{ name = "extracted_decls", type = "map<DeclName, TokenStream>", description = "Mapping of declaration names to their TokenStream representations." }]
  # Lean4-like: proof that extraction preserves semantics

  [[workflow.stages.operation.tasks]]
  name = "Copy Declarations to Output"
  inputs = [{ name = "declarations", from_task = "Find and Extract Declarations for Crate", output_name = "extracted_decls" }]
  operation = { type = "function_call", function = "copy_to_output", args = ["{{ crate_name }}", "{{ declarations }}", "output/"] }
  # Bash-like: cp -r ...

[[workflow.stages]]
name = "Generate New Workspace Structure"
description = "Creates a new Cargo workspace root and individual Cargo.toml files for each processed crate in the output directory."
processor_hint = "Ansible-like templating and file generation"
inputs = [{ name = "processed_crates", from_stage = "Extract and Copy Declarations", output_name = "all_processed_crates_info" }] # Assuming previous stage aggregates info
operation = { type = "sequence" }

  [[workflow.stages.operation.tasks]]
  name = "Create Workspace Root Cargo.toml"
  operation = { type = "function_call", function = "generate_workspace_root_toml", args = ["output/", "{{ processed_crates }}"] }
  # Rust-like: ensures validity of generated TOML schema

  [[workflow.stages.operation.tasks]]
  name = "Create Individual Crate Cargo.toml files"
  operation = { type = "loop", over = "processed_crates", loop_var = "crate_info" }
    [[workflow.stages.operation.tasks.operation.tasks]]
    name = "Generate Crate Cargo.toml"
    operation = { type = "function_call", function = "generate_crate_toml", args = ["output/{{ crate_info.name }}/", "{{ crate_info }}"] }
    # Lisp-like: (generate-crate-toml (path output-dir crate-name) crate-info)



