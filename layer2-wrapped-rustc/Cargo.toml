[package]
name = "wrapped-rustc"
version = "0.1.0"
edition = "2024"
description = "Self-creating Rust system through macro emergence"


[features]
proc_macros = []
full_rustc = []
gpu = ["wgpu"]

[workspace]
members = []

[build-dependencies]
# Build script dependencies for compiler bootstrap

[dependencies]
# Layer 2 depends on generated artifacts from Layer 1
# No dependency on layer1-unified-build crate itself
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit", "parsing"] }
toml = "0.8"
serde_json = "1.0"
rayon = "1.8"
chrono = { version = "0.4", features = ["serde"] }
quote = "1.0"
walkdir = "2.0"
petgraph = "0.6"
proc-macro2 = "1.0"
tracing = "0.1"
smallvec = "1.0"
thin-vec = "0.2"
itertools = "0.12"
libc = "0.2"
wgpu = { version = "0.19", optional = true }
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"
tokio = { version = "1.0", features = ["full"] }
libp2p = { version = "0.54", features = ["gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "tokio"] }
shared_memory = "0.12"
memmap2 = "0.9"
env_logger = "0.11"
notify = "6.0"
futures-intrusive = "0.5"
measureme = "11.0"
indexmap = "2.0"
hashbrown = "0.14"
ena = "0.14"
flate2 = "1.0"
synstructure = "0.13"
arrayvec = "0.7"
jobserver_crate = { version = "0.1.28", package = "jobserver" }
regex = "1.0"
# Rustc internal crates for HIR tracing
rustc_driver = { path = "submodules/rust/compiler/rustc_driver" }
rustc_interface = { path = "submodules/rust/compiler/rustc_interface" }
rustc_middle = { path = "submodules/rust/compiler/rustc_middle" }
rustc_hir = { path = "submodules/rust/compiler/rustc_hir" }
rustc_macros = { path = "submodules/rust/compiler/rustc_macros" }
rustc_serialize = { path = "submodules/rust/compiler/rustc_serialize" }
rustc_hashes = { path = "submodules/rust/compiler/rustc_hashes" }
rustc_graphviz = { path = "submodules/rust/compiler/rustc_graphviz" }
rustc_span = { path = "submodules/rust/compiler/rustc_span" }
rustc_session = { path = "submodules/rust/compiler/rustc_session" }
rustc_index = { path = "submodules/rust/compiler/rustc_index" }
rustc_ast = { path = "submodules/rust/compiler/rustc_ast" }
rustc_errors = { path = "submodules/rust/compiler/rustc_errors" }
bitflags = "2.0"
tempfile = "3.0"
parking_lot = "0.12"
crossbeam-deque = "0.8"
rand = "0.8"
rand_xorshift = "0.3"
ring = "0.17"
# Missing external crates for extracted rustc code
scoped-tls = "1.0"
dyn-clone = "1.0"
lib-introspector-core = { path = "lib-introspector-core" }
serde_path_to_error = "0.1"
aho-corasick = "*"
arrayref = "*"
blake3 = "*"
block-buffer = "*"
cfg-if = "*"
constant_time_eq = "*"
cpufeatures = "*"
crc32fast = "*"
#crossbeam-deque = "*"
crossbeam-epoch = "*"
crossbeam-utils = "*"
crypto-common = "*"
digest = "*"
either = "*"
elsa = "*"
equivalent = "*"
# Rustc compiler crates for extracted code
#rustc_ast = { path = "../rust/compiler/rustc_ast" }
#rustc_middle = { path = "../rust/compiler/rustc_middle" }
#rustc_span = { path = "../rust/compiler/rustc_span" }
#rustc_hir = { path = "../rust/compiler/rustc_hir" }
#rustc_data_structures = { path = "../rust/compiler/rustc_data_structures" }
#rustc_errors = { path = "../rust/compiler/rustc_errors" }
#rustc_session = { path = "../rust/compiler/rustc_session" }

[[bin]]
name = "unified_rustc_wrapped"
path = "src/bin/unified_rustc_wrapped.rs"
required-features = ["full_rustc"]
# [[bin]]
# name = "test_dependency_tracking"
# path = "test_dependency_tracking.rs"
