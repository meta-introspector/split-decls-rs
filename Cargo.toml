[dependencies]
rayon = { workspace = true } # Added for multi-threaded processing
split-decls-syscall-macros = { path = "./syscall-macros" }
anyhow = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_derive = { workspace = true }
serde_json = { workspace = true } # Added for build.rs serialization
tera = {workspace=true} # Template engine for Lean4 code generation
url = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features= ["full","visit", "visit-mut", "extra-traits"] } # Added extra-traits
walkdir = { workspace = true }
split-decls-types = { workspace = true } # Use workspace dependency
chrono = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
base64 = "0.21" # For RDF URL blob encoding
tempfile = { workspace = true }
cargo-toml-generator-types = { workspace = true } # Use workspace dependency
sha2 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
cargo-toml-generator-macros = { workspace = true }
cargo-toml-parts = { path = "build_helpers/cargo_toml_parts" }
pagerank_rs = { path = "submodules/pagerank_rs" }
lazy_static.workspace = true
pathdiff = { workspace = true }
hex = "0.4"
cargo-lock-import = { path = "cargo-lock-import" }
prettyplease = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
lib-cargo = { path = "lib-cargo" }
petgraph = { workspace = true }
regex = "1.0"



[build-dependencies]
cargo-toml-generator-macros = { workspace = true }
cargo-toml-generator-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
cargo-toml-parts = { path = "build_helpers/cargo_toml_parts" }

