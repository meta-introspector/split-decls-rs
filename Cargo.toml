[package]
name = "split-decls-genesis"
version = "0.1.0"
edition = "2024"
description = "Self-creating Rust system through macro emergence"

[workspace]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rayon = "1.8"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
walkdir = "2.0"
petgraph = "0.6"
proc-macro2 = "1.0"
tracing = "0.1"
smallvec = "1.0"
thin-vec = "0.2"
either = "1.0"
itertools = "0.12"
libc = "0.2"
measureme = "11.0"
indexmap = "2.0"
hashbrown = "0.14"
ena = "0.14"
arrayvec = "0.7"
jobserver = "0.1"
bitflags = "2.0"
tempfile = "3.0"
parking_lot = "0.12"
crossbeam-deque = "0.8"
rand = "0.8"
rand_xorshift = "0.3"
ring = "0.17"

[build-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
walkdir = "2.0"
