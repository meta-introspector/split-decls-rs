[package]
name = "split-decls-genesis"
version = "0.1.0"
edition = "2024"
description = "Self-creating Rust system through macro emergence"

[workspace]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rayon = "1.8"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
walkdir = "2.0"
petgraph = "0.6"
proc-macro2 = "1.0"

[build-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
walkdir = "2.0"
