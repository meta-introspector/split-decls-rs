[package]
name = "split-decls-rs"
version = "0.1.0"
edition = "2024"
authors = []

[features]
default = ["tokio_unstable"]
tokio_unstable = []

[[bin]]
name = "rdf_cli"
path = "src/bin/rdf_cli.rs"

[[bin]]
name = "ngram_ontology"
path = "src/bin/ngram_ontology.rs"

[[bin]]
name = "ontology_summary"
path = "src/bin/ontology_summary.rs"

[[bin]]
name = "layer_ontology"
path = "src/bin/layer_ontology.rs"

[[bin]]
name = "ast_reflector"
path = "src/bin/ast_reflector.rs"

[[bin]]
name = "sparql_ast_bridge"
path = "src/bin/sparql_ast_bridge.rs"

[[bin]]
name = "syscall_oracle"
path = "src/bin/syscall_oracle.rs"

[[bin]]
name = "syscall_decouple"
path = "src/bin/syscall_decouple.rs"

[[bin]]
name = "real_syscall_analyzer"
path = "src/bin/real_syscall_analyzer.rs"

[[bin]]
name = "apply_process_audit"
path = "src/bin/apply_process_audit.rs"

[[bin]]
name = "bott_macro_gen"
path = "src/bin/bott_macro_gen.rs"

[[bin]]
name = "introspect_demo"
path = "src/bin/introspect_demo.rs"

[profile.release]
debug = true

