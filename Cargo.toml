[package]
name = "split-decls-genesis"
version = "0.1.0"
edition = "2024"
description = "Self-creating Rust system through macro emergence"
default-run = "split-decls-genesis"

[workspace]
members = ["runbuild"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit", "parsing"] }
toml = "0.8"
serde_json = "1.0"
rayon = "1.8"
quote = "1.0"
walkdir = "2.0"
petgraph = "0.6"
proc-macro2 = "1.0"
tracing = "0.1"
smallvec = "1.0"
thin-vec = "0.2"
itertools = "0.12"
libc = "0.2"
measureme = "11.0"
indexmap = "2.0"
hashbrown = "0.14"
ena = "0.14"
flate2 = "1.0"
synstructure = "0.13"
arrayvec = "0.7"
jobserver = "0.1"
bitflags = "2.0"
tempfile = "3.0"
parking_lot = "0.12"
crossbeam-deque = "0.8"
rand = "0.8"
rand_xorshift = "0.3"
ring = "0.17"
regex = "1.0"
chrono = { version = "0.4", features = ["serde"] }

# Missing external crates for extracted rustc code
scoped-tls = "1.0"
dyn-clone = "1.0"
serde_path_to_error = "0.1"
aho-corasick = "*"
arrayref = "*"
blake3 = "*"
block-buffer = "*"
cfg-if = "*"
constant_time_eq = "*"
cpufeatures = "*"
crc32fast = "*"
#crossbeam-deque = "*"
crossbeam-epoch = "*"
crossbeam-utils = "*"
crypto-common = "*"
digest = "*"
either = "*"
elsa = "*"
equivalent = "*"

# Rustc compiler crates for extracted code
#rustc_ast = { path = "../rust/compiler/rustc_ast" }
#rustc_middle = { path = "../rust/compiler/rustc_middle" }
#rustc_span = { path = "../rust/compiler/rustc_span" }
#rustc_hir = { path = "../rust/compiler/rustc_hir" }
#rustc_data_structures = { path = "../rust/compiler/rustc_data_structures" }
#rustc_errors = { path = "../rust/compiler/rustc_errors" }
#rustc_session = { path = "../rust/compiler/rustc_session" }

[build-dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
syn = { version = "2.0", features = ["full", "visit", "parsing"] }
quote = "1.0"
walkdir = "2.0"
flate2 = "1.0"

[[bin]]
name = "unified_rustc_wrapped"
path = "src/bin/unified_rustc_wrapped.rs"

# [[bin]]
# name = "test_dependency_tracking"
# path = "test_dependency_tracking.rs"
