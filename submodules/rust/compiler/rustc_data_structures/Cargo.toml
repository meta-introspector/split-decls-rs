[package]
name = "rustc_data_structures"
version = "0.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"
[dependencies]
libc = "0.2"
indexmap = "2.0"
smallvec = "1.0"
hashbrown = "0.14"
thin-vec = "0.2"
memmap2 = "0.9"
measureme = "11.0"
rustc_index = { path = "../rustc_index" }
stacker = "0.1"
parking_lot = "0.12"
jobserver = "0.1"
tracing = "0.1"
rustc-hash = "2.0"
rustc_hashes = { path = "../rustc_hashes" }
ena = "0.14"
arrayvec = "0.7"
bitflags = "2.0"
either = "1.0"
elsa = "1.0"
tempfile = "3.0"
rustc_thread_pool = { path = "../rustc_thread_pool" }
rustc-stable-hash = "0.1"
rustc_serialize = { path = "../rustc_serialize" }
rustc_graphviz = { path = "../rustc_graphviz" }
