[package]
name = "cargo-tree-macro"
version = "0.1.0"
edition = "2021"

[dependencies]
proc-macro2 = "1.0"
syn = { version = "1.0", features = ["full"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
anyhow = "1.0"
lazy_static = "1.4"

[lib]
proc-macro = true

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
anyhow = "1.0"
glob = "0.3"
walkdir = "2.3"
pathdiff = "0.2"
serde_json = "1.0"
cargo_metadata = "0.18"

[features]
# Add any features needed for the macro or its build script
