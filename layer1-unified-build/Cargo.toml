[package]
name = "unified-build"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
walkdir = "2.0"
anyhow = "1.0"
toml = "0.8"
