[package]
name = "incremental-bootstrap"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
petgraph = "0.6"
clap = { version = "4.0", features = ["derive"] }
syn = { version = "2.0", features = ["full", "visit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "incremental-bootstrap"
path = "src/main.rs"
